# Docker Compose配置文件
version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asset_management_backend
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库文件
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    environment:
      - DATABASE_URL=sqlite:///./data/asset_management.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 初始化服务（只运行一次）
  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asset_management_init
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/asset_management.db
    command: ["python", "scripts/init_db.py"]
    depends_on:
      - backend
    restart: "no"

volumes:
  data:
